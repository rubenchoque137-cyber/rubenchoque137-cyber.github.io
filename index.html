<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXO Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { gold: '#d4af37' } } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0c10; color: #e2e8f0; font-family: sans-serif; }
    .glass { background: rgba(18, 21, 30, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="p-4 max-w-4xl mx-auto space-y-6">

  <div id="toast" class="hidden fixed top-4 right-4 left-4 p-4 rounded-xl text-black font-bold text-center z-50 bg-brand-gold shadow-lg"></div>

  <header class="flex justify-between items-center glass p-4 rounded-2xl">
    <h1 class="font-bold text-brand-gold text-lg">NEXO ADMIN</h1>
    <a href="https://corporationnexo.github.io" target="_blank" class="text-xs bg-white/10 px-3 py-2 rounded-lg text-white">Ver Tienda</a>
  </header>

  <form id="product-form" onsubmit="saveProduct(event)" class="glass p-6 rounded-2xl space-y-4">
    <h2 class="font-bold text-white text-base">Publicar Producto</h2>
    <div>
      <label class="text-xs text-slate-400">Título</label>
      <input type="text" id="p-title" required class="w-full bg-black/50 border border-white/20 p-3 rounded-xl text-white text-sm">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs text-slate-400">Precio (Bs)</label>
        <input type="number" step="0.5" id="p-price" required class="w-full bg-black/50 border border-white/20 p-3 rounded-xl text-white text-sm">
      </div>
      <div>
        <label class="text-xs text-slate-400">Categoría</label>
        <select id="p-cat" class="w-full bg-black/50 border border-white/20 p-3 rounded-xl text-white text-sm">
          <option value="Ropa">Ropa</option>
          <option value="Electrónica">Electrónica</option>
          <option value="Accesorios">Accesorios</option>
          <option value="Otros">Otros</option>
        </select>
      </div>
    </div>
    <div>
      <label class="text-xs text-slate-400">URL Imagen</label>
      <input type="url" id="p-img" required class="w-full bg-black/50 border border-white/20 p-3 rounded-xl text-white text-sm">
    </div>
    <div>
      <label class="text-xs text-slate-400">Descripción</label>
      <textarea id="p-desc" rows="2" required class="w-full bg-black/50 border border-white/20 p-3 rounded-xl text-white text-sm"></textarea>
    </div>
    <button type="submit" class="w-full py-3 bg-brand-gold text-black font-bold rounded-xl text-sm uppercase">Guardar en la Nube</button>
  </form>

  <div class="glass p-6 rounded-2xl space-y-4">
    <h2 class="font-bold text-white text-base">Productos en la Nube</h2>
    <div id="list" class="space-y-3">Cargando...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1tz7MlQtm1VHMNVMZ8q9Io_LcJXSegSU",
      authDomain: "nexo-store-61557.firebaseapp.com",
      projectId: "nexo-store-61557",
      storageBucket: "nexo-store-61557.firebasestorage.app",
      messagingSenderId: "124759290340",
      appId: "1:124759290340:web:954c00e821e80c6aead7f1",
      measurementId: "G-FXWS2H5DSK"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    window.showMsg = (txt) => {
      const t = document.getElementById('toast');
      t.innerText = txt;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    }

    window.loadProducts = async function() {
      const list = document.getElementById('list');
      try {
        const snap = await getDocs(collection(db, "products"));
        if(snap.empty) {
          list.innerHTML = "<p class='text-xs text-slate-500'>No hay productos.</p>";
          return;
        }
        let html = "";
        snap.forEach(d => {
          const p = d.data();
          html += `<div class='flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/10'>
            <div class='flex items-center gap-3'>
              <img src='${p.img}' class='w-10 h-10 object-cover rounded-lg'>
              <div><p class='text-sm font-bold text-white'>${p.title}</p><p class='text-xs text-brand-gold'>${p.price} Bs</p></div>
            </div>
            <button onclick="del('${d.id}')" class='text-red-400 px-3 py-1 text-xs bg-red-500/10 rounded-lg'>Eliminar</button>
          </div>`;
        });
        list.innerHTML = html;
      } catch(e) {
        list.innerHTML = "<p class='text-xs text-red-400'>Error al cargar de Firebase.</p>";
      }
    }

    window.saveProduct = async function(e) {
      e.preventDefault();
      try {
        await addDoc(collection(db, "products"), {
          title: document.getElementById('p-title').value,
          price: parseFloat(document.getElementById('p-price').value),
          category: document.getElementById('p-cat').value,
          img: document.getElementById('p-img').value,
          desc: document.getElementById('p-desc').value
        });
        document.getElementById('product-form').reset();
        showMsg("¡Publicado con éxito!");
        loadProducts();
      } catch(err) {
        showMsg("Error al publicar");
      }
    }

    window.del = async function(id) {
      if(confirm("¿Eliminar?")) {
        await deleteDoc(doc(db, "products", id));
        showMsg("Eliminado");
        loadProducts();
      }
    }

    loadProducts();
  </script>
</body>
</html>
