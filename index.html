<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXO Store - Panel Administrativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { gold: '#d4af37' } } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #e2e8f0; }
    .glass { background: rgba(18, 21, 30, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0c10; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-gold selection:text-black">

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none px-4 sm:px-0"></div>

  <header class="sticky top-0 z-40 glass border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div id="admin-logo-box" class="w-10 h-10 rounded-lg bg-gradient-to-tr from-brand-gold to-yellow-200 flex items-center justify-center text-black font-bold text-xl shadow-lg overflow-hidden">
          <span id="admin-logo-text">N</span>
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-wider text-white block leading-none">NEXO</span>
          <span class="text-xs text-brand-gold font-medium tracking-widest uppercase">Panel Admin</span>
        </div>
      </div>
      <a href="https://corporationnexo.github.io" target="_blank" class="px-4 py-2 bg-white/5 text-slate-300 rounded-lg text-xs font-semibold hover:bg-white/10 border border-white/10 flex items-center gap-2">
        <i class="fa-solid fa-store text-brand-gold"></i>
        <span>Ver Tienda Pública</span>
      </a>
    </div>
  </header>

  <main class="flex-grow py-8 sm:py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
      
      <div class="flex gap-3 border-b border-white/10 pb-4">
        <button onclick="switchAdminTab('products')" id="tab-btn-products" class="px-4 py-2 rounded-lg bg-brand-gold text-black font-bold text-xs tracking-wider transition-all flex items-center gap-2">
          <i class="fa-solid fa-box"></i> <span>Gestión de Productos</span>
        </button>
        <button onclick="switchAdminTab('config')" id="tab-btn-config" class="px-4 py-2 rounded-lg bg-white/5 text-slate-300 font-semibold text-xs tracking-wider hover:bg-white/10 transition-all flex items-center gap-2">
          <i class="fa-solid fa-gear"></i> <span>Ajustes, Logo y Redes</span>
        </button>
      </div>

      <!-- VISTA PRODUCTOS -->
      <div id="admin-view-products" class="grid lg:grid-cols-3 gap-8">
        <div class="glass p-6 rounded-2xl space-y-4 h-fit">
          <h3 class="text-lg font-bold text-white border-b border-white/10 pb-3" id="admin-form-title">Agregar Nuevo Producto</h3>
          <form id="product-form" onsubmit="handleProductSubmit(event)" class="space-y-4">
            <input type="hidden" id="prod-id">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Nombre del Producto</label>
              <input type="text" id="prod-title" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Precio (Bs)</label>
                <input type="number" step="0.5" id="prod-price" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Precio Oferta (Bs)</label>
                <input type="number" step="0.5" id="prod-old-price" placeholder="Opcional" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
              </div>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Categoría</label>
              <select id="prod-category" class="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
                <option value="Ropa">Ropa & Calzado</option>
                <option value="Electrónica">Electrónica & Tech</option>
                <option value="Accesorios">Accesorios</option>
                <option value="Otros">Otros</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">URL de la Imagen</label>
              <input type="url" id="prod-img" required placeholder="https://..." class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Descripción</label>
              <textarea id="prod-desc" rows="3" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none"></textarea>
            </div>
            <div class="flex gap-2">
              <button type="submit" id="btn-save-prod" class="w-full py-3 bg-brand-gold text-black font-bold rounded-lg hover:bg-yellow-400 transition-all text-xs uppercase tracking-wider">Publicar Producto</button>
              <button type="button" id="btn-cancel-edit" onclick="resetProductForm()" class="hidden px-4 py-3 bg-white/5 text-slate-300 rounded-lg text-xs hover:bg-white/10">Cancelar</button>
            </div>
          </form>
        </div>

        <div class="lg:col-span-2 glass p-6 rounded-2xl space-y-4">
          <div class="flex justify-between items-center border-b border-white/10 pb-3">
            <h3 class="text-lg font-bold text-white">Inventario en la Nube</h3>
            <span id="product-counter" class="text-xs px-2.5 py-1 rounded-full bg-brand-gold/10 text-brand-gold font-semibold border border-brand-gold/20">0 Artículos</span>
          </div>
          <div id="admin-products-list" class="space-y-3 max-h-[600px] overflow-y-auto pr-2"></div>
        </div>
      </div>

      <!-- VISTA CONFIGURACIÓN -->
      <div id="admin-view-config" class="hidden max-w-2xl mx-auto glass p-6 sm:p-8 rounded-2xl space-y-6">
        <div class="border-b border-white/10 pb-4">
          <h3 class="text-xl font-bold text-white">Configuración de Tienda</h3>
          <p class="text-xs text-slate-400 mt-1">Modifica el logo, WhatsApp y redes oficiales.</p>
        </div>
        <form onsubmit="handleConfigSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">URL de Imagen para el Logo (Reemplaza la "N")</label>
            <input type="url" id="cfg-logo-url" placeholder="https://..." class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1">WhatsApp Oficial (+59167066956)</label>
              <input type="text" id="cfg-wa-num" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Usuario de WhatsApp (@_ruben.1.7)</label>
              <input type="text" id="cfg-wa-user" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Instagram URL</label>
            <input type="url" id="cfg-ig" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Facebook URL</label>
            <input type="url" id="cfg-fb" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">TikTok URL</label>
            <input type="url" id="cfg-tk" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-brand-gold focus:outline-none">
          </div>
          <button type="submit" class="w-full py-3 bg-brand-gold text-black font-bold rounded-lg hover:bg-yellow-400 transition-all text-xs uppercase tracking-wider">Guardar Cambios en la Nube</button>
        </form>
      </div>

    </div>
  </main>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1tz7MlQtm1VHMNVMZ8q9Io_LcJXSegSU",
      authDomain: "nexo-store-61557.firebaseapp.com",
      projectId: "nexo-store-61557",
      storageBucket: "nexo-store-61557.firebasestorage.app",
      messagingSenderId: "124759290340",
      appId: "1:124759290340:web:954c00e821e80c6aead7f1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let products = [];
    let storeConfig = {};

    async function loadDataFromCloud() {
      try {
        const configDoc = await getDoc(doc(db, "settings", "storeConfig"));
        if (configDoc.exists()) {
          storeConfig = configDoc.data();
          document.getElementById('cfg-logo-url').value = storeConfig.logoUrl || '';
          document.getElementById('cfg-wa-num').value = storeConfig.whatsappNum || '';
          document.getElementById('cfg-wa-user').value = storeConfig.whatsappUser || '';
          document.getElementById('cfg-ig').value = storeConfig.instagramUrl || '';
          document.getElementById('cfg-fb').value = storeConfig.facebookUrl || '';
          document.getElementById('cfg-tk').value = storeConfig.tiktokUrl || '';
        }

        const querySnapshot = await getDocs(collection(db, "products"));
        products = [];
        querySnapshot.forEach((docSnap) => {
          products.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderAdminProducts();
        applyLogo();
      } catch (error) {
        showToast("Error al conectar con la nube", "error");
      }
    }

    window.handleConfigSubmit = async function(e) {
      e.preventDefault();
      storeConfig = {
        logoUrl: document.getElementById('cfg-logo-url').value.trim(),
        whatsappNum: document.getElementById('cfg-wa-num').value.trim(),
        whatsappUser: document.getElementById('cfg-wa-user').value.trim(),
        instagramUrl: document.getElementById('cfg-ig').value.trim(),
        facebookUrl: document.getElementById('cfg-fb').value.trim(),
        tiktokUrl: document.getElementById('cfg-tk').value.trim()
      };
      try {
        await setDoc(doc(db, "settings", "storeConfig"), storeConfig);
        applyLogo();
        showToast("¡Configuración guardada en la nube!");
      } catch (error) {
        showToast("Error al guardar", "error");
      }
    }

    window.handleProductSubmit = async function(e) {
      e.preventDefault();
      const id = document.getElementById('prod-id').value;
      const prodData = {
        title: document.getElementById('prod-title').value.trim(),
        price: parseFloat(document.getElementById('prod-price').value),
        oldPrice: parseFloat(document.getElementById('prod-old-price').value) || null,
        category: document.getElementById('prod-category').value,
        img: document.getElementById('prod-img').value.trim(),
        desc: document.getElementById('prod-desc').value.trim()
      };
      try {
        if (id) {
          await updateDoc(doc(db, "products", id), prodData);
          showToast("Producto actualizado.");
        } else {
          await addDoc(collection(db, "products"), prodData);
          showToast("Nuevo producto publicado.");
        }
        resetProductForm();
        loadDataFromCloud();
      } catch (error) {
        showToast("Error al procesar producto", "error");
      }
    }

    window.deleteProduct = async function(id) {
      if (confirm("¿Estás seguro de eliminar este producto?")) {
        try {
          await deleteDoc(doc(db, "products", id));
          showToast("Producto eliminado.");
          loadDataFromCloud();
        } catch (error) {
          showToast("Error al eliminar", "error");
        }
      }
    }

    function applyLogo() {
      const adminLogoBox = document.getElementById('admin-logo-box');
      if(storeConfig.logoUrl && storeConfig.logoUrl.trim() !== "") {
        adminLogoBox.innerHTML = `<img src="${storeConfig.logoUrl}" class="w-full h-full object-cover">`;
      } else {
        adminLogoBox.innerHTML = `<span id="admin-logo-text">N</span>`;
      }
    }

    window.editProduct = function(id) {
      const p = products.find(item => item.id === id);
      if(!p) return;
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-title').value = p.title;
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-old-price').value = p.oldPrice || '';
      document.getElementById('prod-category').value = p.category;
      document.getElementById('prod-img').value = p.img;
      document.getElementById('prod-desc').value = p.desc;
      document.getElementById('admin-form-title').innerText = "Editar Producto";
      document.getElementById('btn-save-prod').innerText = "Actualizar Producto";
      document.getElementById('btn-cancel-edit').classList.remove('hidden');
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    window.resetProductForm = function() {
      document.getElementById('product-form').reset();
      document.getElementById('prod-id').value = '';
      document.getElementById('admin-form-title').innerText = "Agregar Nuevo Producto";
      document.getElementById('btn-save-prod').innerText = "Publicar Producto";
      document.getElementById('btn-cancel-edit').classList.add('hidden');
    }

    window.switchAdminTab = function(tab) {
      const prodView = document.getElementById('admin-view-products');
      const cfgView = document.getElementById('admin-view-config');
      const btnProd = document.getElementById('tab-btn-products');
      const btnCfg = document.getElementById('tab-btn-config');
      if(tab === 'products') {
        prodView.classList.remove('hidden');
        cfgView.classList.add('hidden');
        btnProd.className = "px-4 py-2 rounded-lg bg-brand-gold text-black font-bold text-xs tracking-wider transition-all flex items-center gap-2";
        btnCfg.className = "px-4 py-2 rounded-lg bg-white/5 text-slate-300 font-semibold text-xs tracking-wider hover:bg-white/10 transition-all flex items-center gap-2";
      } else {
        prodView.classList.add('hidden');
        cfgView.classList.remove('hidden');
        btnCfg.className = "px-4 py-2 rounded-lg bg-brand-gold text-black font-bold text-xs tracking-wider transition-all flex items-center gap-2";
        btnProd.className = "px-4 py-2 rounded-lg bg-white/5 text-slate-300 font-semibold text-xs tracking-wider hover:bg-white/10 transition-all flex items-center gap-2";
      }
    }

    function renderAdminProducts() {
      const container = document.getElementById('admin-products-list');
      const counter = document.getElementById('product-counter');
      if(!container) return;
      counter.innerText = `${products.length} Artículo${products.length !== 1 ? 's' : ''}`;
      if(products.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">No hay productos en el inventario.</div>`;
        return;
      }
      container.innerHTML = products.map(p => `
        <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5 gap-3 hover:border-brand-gold/30 transition-all">
          <div class="flex items-center gap-3 overflow-hidden">
            <img src="${p.img}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0 bg-slate-900">
            <div class="truncate">
              <h4 class="text-sm font-bold text-white truncate">${p.title}</h4>
              <p class="text-xs text-slate-400">${p.price} Bs - <span class="text-brand-gold font-semibold">${p.category}</span></p>
            </div>
          </div>
          <div class="flex items-center gap-1 flex-shrink-0">
            <button onclick="editProduct('${p.id}')" class="p-2 text-slate-400 hover:text-white"><i class="fa-solid fa-pen-to-square"></i></button>
            <button onclick="deleteProduct('${p.id}')" class="p-2 text-red-400 hover:text-red-300"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>
      `).join('');
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      if(!container) return;
      const toast = document.createElement('div');
      toast.className = `px-4 py-3 rounded-xl text-xs font-semibold text-white pointer-events-auto transition-all transform translate-y-2 glass border ${type === 'success' ? 'border-brand-gold/30' : 'border-red-500/30'}`;
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    window.addEventListener('DOMContentLoaded', loadDataFromCloud);
  </script>
</body>
</html>
